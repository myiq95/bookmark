<title>책갈피 — 나만의 서재</title>
<style>
:root{--bg:#f7f4ee;--paper:#fffdf9;--ink:#292a27;--muted:#85847d;--line:#e8e3da;--accent:#526b58;--accent-soft:#e8eee5;--quote:#f0ece4;--shadow:0 12px 35px #28251a0a}
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}#app{min-height:100dvh;max-width:1160px;margin:auto;padding:0 24px 90px}.top{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:24px;letter-spacing:-.7px}.mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff}.mark svg{width:19px}.top-actions{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;background:var(--paper)}.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.hero{padding:42px 0 26px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:12px;letter-spacing:1.8px;color:var(--accent);font-weight:700}.hero h1{font-family:Georgia,"Apple SD Gothic Neo",serif;font-weight:500;font-size:clamp(29px,5vw,43px);letter-spacing:-1.5px;margin:10px 0 8px}.hero p{margin:0;color:var(--muted);font-size:14px}.primary{background:var(--accent);color:white;border-radius:14px;padding:13px 18px;font-size:14px;font-weight:600;white-space:nowrap}.primary svg{width:17px;height:17px;vertical-align:middle;margin-right:6px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px}.quick button{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:var(--shadow)}.quick .qicon{width:43px;height:43px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}.qicon svg{width:21px;stroke:currentColor;fill:none;stroke-width:1.7}.quick strong{display:block;font-size:15px;margin-bottom:4px}.quick small{color:var(--muted);font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 15px}.section-head h2{font-size:18px;margin:0;font-weight:650;letter-spacing:-.5px}.section-head span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:5px;background:#eeebe4;padding:4px;border-radius:12px}.tabs button{font-size:12px;padding:9px 13px;border-radius:9px;color:var(--muted)}.tabs button.active{background:var(--paper);color:var(--ink);box-shadow:0 2px 7px #2221}.books{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.book{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:13px;min-width:0;position:relative;box-shadow:var(--shadow)}.cover{height:175px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;position:relative;overflow:hidden;color:#f9f5ed;background:linear-gradient(145deg,#7a8b75,#405744)}.cover:before{content:"";position:absolute;width:150px;height:150px;border:1px solid #ffffff38;border-radius:50%;right:-65px;bottom:-65px}.cover:after{content:"";position:absolute;width:95px;height:95px;border:1px solid #ffffff35;border-radius:50%;right:-35px;bottom:-35px}.cover-title{font-family:Georgia,"Apple SD Gothic Neo",serif;font-size:20px;line-height:1.45;z-index:1;word-break:keep-all}.cover-2{background:linear-gradient(145deg,#b98d6e,#704b3c)}.cover-3{background:linear-gradient(145deg,#8399a7,#435a6a)}.cover-4{background:linear-gradient(145deg,#b1a17a,#736341)}.book-title{font-size:14px;font-weight:650;line-height:1.5;margin:13px 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.book-meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:5px}.progress{height:3px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}.bookdelete{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border:1px solid #eadbd7;border-radius:12px;background:var(--paper);color:#a34b42;display:grid;place-items:center;z-index:2;box-shadow:0 2px 8px #0000000a}.bookdelete svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.bookdelete:active{transform:scale(.95)}.bookmenu{position:absolute;right:18px;top:18px;background:#fffdf9dd;border-radius:9px;width:30px;height:30px;font-size:20px;line-height:20px;backdrop-filter:blur(8px)}.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed #d8d1c5;border-radius:18px;grid-column:1/-1}.empty b{display:block;color:var(--ink);margin-bottom:8px}.bottom-note{text-align:center;color:#a19e96;font-size:11px;margin-top:40px}.privacy-note{margin:34px 0;padding:17px 19px;border:1px solid var(--line);border-radius:16px;color:var(--muted);font-size:13px;line-height:1.7;background:var(--paper)}

/* 홈 화면: 여백 있는 책 일러스트와 절제된 동작 메뉴 */
.home-hero{min-height:310px;padding:34px 0 20px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px;overflow:hidden}
.home-copy{position:relative;z-index:1}.home-copy h1{font-family:Georgia,"Apple SD Gothic Neo",serif;font-size:clamp(31px,5vw,45px);font-weight:500;line-height:1.32;letter-spacing:-1.5px;margin:14px 0 13px}.home-copy p{font-size:14px;line-height:1.9;color:var(--muted);margin:0}.home-art{min-width:0;display:flex;align-items:center;justify-content:center}.home-art svg{width:min(100%,390px);height:auto;overflow:visible;filter:drop-shadow(0 12px 12px #292a2708)}
.home-actions{max-width:650px;margin:10px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}.home-action{min-width:0;display:flex;align-items:center;gap:13px;text-align:left;padding:16px 17px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--paper) 82%,transparent);transition:border-color .2s,transform .2s}.home-action:active{transform:scale(.985)}.action-icon{width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.action-icon svg,.library-link svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.home-action strong{display:block;font-size:14px;font-weight:650;margin-bottom:4px}.home-action small{display:block;color:var(--muted);font-size:11px;line-height:1.5}.action-arrow{margin-left:auto;color:#a7a79a;font-size:17px}.library-link{display:flex;align-items:center;gap:9px;margin:24px auto 0;padding:10px 13px;color:var(--accent);font-size:13px;border-bottom:1px solid #cfd6c8}.library-link svg{width:18px;height:18px}.privacy-note{max-width:650px;margin:22px auto 0;padding:0;border:0;background:transparent;text-align:center;font-size:11px;line-height:1.7;color:#9a988f}
@media(max-width:600px){#app{padding:0 20px 50px}.home-hero{min-height:0;grid-template-columns:1fr;gap:0;padding:32px 0 10px}.home-copy h1{font-size:35px;margin:11px 0 8px}.home-copy p{font-size:13px;line-height:1.75}.home-art{margin-top:-8px;height:205px}.home-art svg{width:min(100%,310px);max-height:220px}.home-actions{margin-top:8px;grid-template-columns:1fr;gap:9px;max-width:430px}.home-action{padding:12px 14px}.action-icon{width:36px;height:36px;flex-basis:36px}.library-link{margin-top:19px}.privacy-note{margin-top:16px}}
body.night .home-art{filter:brightness(.88)}

/* reader */
#reader{display:none;position:fixed;inset:0;width:100%;max-width:100vw;min-width:0;background:var(--bg);z-index:20;overflow-y:auto;overflow-x:hidden;overscroll-behavior-x:none}.reader-top{height:64px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);z-index:3}.reader-title{font-size:13px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.reader-actions{display:flex;gap:7px}.reader-actions .iconbtn{width:38px;height:38px;background:var(--paper)}#readerBody{box-sizing:border-box;width:100%;max-width:min(720px,100vw);min-width:0;margin:0 auto;padding:54px 26px 150px;overflow-wrap:anywhere;font-family:Georgia,"Apple SD Gothic Neo",serif;font-size:19px;line-height:1.95;letter-spacing:0;word-break:keep-all}.chapter-title{text-align:center;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:24px;line-height:1.5;font-weight:700;margin:60px 0 36px;letter-spacing:-.8px}.chapter-title:first-child{margin-top:20px}.reader-p{max-width:100%;min-width:0;margin:0 0 1.25em;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}.reader-p.dialogue{background:var(--quote);border-left:3px solid var(--accent);padding:8px 13px;border-radius:0 8px 8px 0;margin:.7em 0;font-style:normal;color:var(--ink)}.reader-tools{transition:transform .22s ease,opacity .22s ease;position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;align-items:center;z-index:4}.reader-tools button{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.reader-tools input{width:100px;accent-color:var(--accent)}.reader-tools .spacing-control{display:flex;align-items:center;gap:3px;color:var(--muted);font-size:12px}.reader-tools .spacing-control input{width:55px}.reader-tools select{max-width:125px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px;font-size:12px}.reader-tools .tool-label{font-size:11px;color:var(--muted)}#tocPanel{position:fixed;top:0;bottom:0;right:0;width:min(340px,88vw);background:var(--paper);z-index:30;box-shadow:-20px 0 60px #0002;padding:20px;transform:translateX(110%);transition:transform .25s;overflow:auto}#tocPanel.open{transform:translateX(0)}.toc-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 22px}.toc-head strong{font-size:18px}.toc-item{display:block;width:100%;text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}.toc-item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.shade{display:none;position:fixed;inset:0;background:#17191555;z-index:25}.shade.open{display:block}
/* modal/settings */
.modal{display:none;position:fixed;inset:0;z-index:40;background:#17191566;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{background:var(--paper);border-radius:22px;padding:24px;width:min(440px,100%);box-shadow:0 20px 70px #0002}.dialog h3{margin:0 0 18px;font-size:20px}.dialog textarea,.dialog input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:13px;margin:7px 0 13px;outline-color:var(--accent)}.dialog textarea{height:220px;resize:vertical}.dialog label{font-size:12px;color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.secondary{padding:12px 16px;border:1px solid var(--line);border-radius:12px}.danger{color:#a34b42}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.settings-row select,.settings-row input{max-width:160px;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg)}
body.night{--bg:#202320;--paper:#292d29;--ink:#e8e5dc;--muted:#a6a69c;--line:#3a4039;--accent:#a5b99d;--accent-soft:#343e33;--quote:#333a32;--shadow:0 12px 35px #00000012}body.night .cover{filter:saturate(.8)}
@media(max-width:760px){#app{padding:0 18px 60px}.top{height:68px}.hero{padding:32px 0 22px}.quick button{padding:14px;gap:10px}.quick .qicon{width:38px;height:38px}.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cover{height:190px}.book{padding:10px}.book-title{font-size:13px}.reader-top{padding:0 12px}.reader-actions{gap:5px}.reader-actions .iconbtn{width:35px;height:35px}#readerBody{padding:38px 23px 145px;font-size:18px}.reader-tools{gap:7px;padding-left:10px;padding-right:10px}.reader-tools input{width:58px}.reader-tools .spacing-control input{width:34px}.reader-tools select{max-width:105px}}
</style></head>

$('#pasteBtn').onclick=()=>openModal('pasteModal');if($('#pasteBtnLibrary'))$('#pasteBtnLibrary').onclick=()=>openModal('pasteModal');if($('#fileBtnLibrary'))$('#fileBtnLibrary').onclick=()=>$('#fileInput').click();$('#savePaste').onclick=()=>{let t=$('#pasteText').value.trim(),name=$('#pasteTitle').value.trim();if(!t){alert('본문을 입력하세요.');return}closeModal('pasteModal');addBook(name,t);$('#pasteText').value='';$('#pasteTitle').value=''};
$$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));$('#settingsBtn').onclick=()=>openModal('settingsModal');$('#nightSetting').onchange=e=>{if(activeBook){activeBook.night=e.target.checked;applyReaderSettings();dbPut(activeBook)}else document.body.classList.toggle('night',e.target.checked)};$('#ttsRate').onchange=e=>ttsRate=+e.target.value;
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;renderBooks()});
$('#backBtn').onclick=closeReader;$('#reader').addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(saveProgress,700);autoHideReaderTools()});$('#fontRange').oninput=e=>{if(activeBook){activeBook.fontSize=+e.target.value;applyReaderSettings()}};$('#spacingRange').oninput=e=>{if(activeBook){activeBook.letterSpacing=+e.target.value;applyReaderSettings();dbPut(activeBook)}};$('#fontSelect').onchange=e=>{if(activeBook){activeBook.fontFamily=e.target.value;applyReaderSettings();dbPut(activeBook)}};$('#fontMinus').onclick=()=>{$('#fontRange').value=Math.max(15,+$('#fontRange').value-1);$('#fontRange').oninput({target:$('#fontRange')})};$('#fontPlus').onclick=()=>{$('#fontRange').value=Math.min(30,+$('#fontRange').value+1);$('#fontRange').oninput({target:$('#fontRange')})};$('#nightBtn').onclick=()=>{if(activeBook){activeBook.night=!activeBook.night;applyReaderSettings();dbPut(activeBook)}};
$('#tocBtn').onclick=()=>{$('#tocPanel').classList.add('open');$('#shade').classList.add('open');renderToc()};$('#closeToc').onclick=closeToc;$('#shade').onclick=closeToc;function closeToc(){$('#tocPanel').classList.remove('open');$('#shade').classList.remove('open')}
function renderToc(){let b=activeBook;$('#tocList').innerHTML=currentToc.map((x,i)=>`<button class="toc-item" data-jump="${i}">${esc(x.title)}<small>${i===0?'처음부터':`목차 ${i+1}`}</small></button>`).join('');$$('[data-jump]').forEach(el=>el.onclick=()=>{let i=+el.dataset.jump,x=currentToc[i],text=b.text.slice(x.offset),body=$('#readerBody'),target=body.querySelectorAll('.chapter-title')[i];if(target)target.scrollIntoView({behavior:'smooth'});else body.scrollIntoView();closeToc()})}
$('#makeToc').onclick=()=>{closeToc();$('#tocInput').value=currentToc.map(x=>x.title).join('\n');openModal('tocModal')};$('#saveToc').onclick=()=>{let lines=$('#tocInput').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),text=activeBook.text;activeBook.toc=lines.map((title,i)=>{let at=text.indexOf(title);return {title,offset:at>=0?at:Math.round(i*text.length/Math.max(1,lines.length)),synthetic:at<0}});dbPut(activeBook);renderReader();closeModal('tocModal')};
$('#readAloud').onclick=()=>{if(!activeBook)return;if(speechSynthesis.speaking){speechSynthesis.cancel();return}let text=$('#readerBody').innerText,utter=new SpeechSynthesisUtterance(text);utter.lang='ko-KR';utter.rate=ttsRate;speechSynthesis.speak(utter)};
let lastScroll=0,hideTimer;function autoHideReaderTools(){let r=$('#reader'),tools=$('.reader-tools');if(r.scrollTop>lastScroll+5){tools.style.transform='translateY(130%)';tools.style.opacity='0'}else if(r.scrollTop<lastScroll-5){tools.style.transform='translateY(0)';tools.style.opacity='1'}lastScroll=r.scrollTop;clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(r.scrollTop>80){tools.style.transform='translateY(130%)';tools.style.opacity='0'}},1800)}
